openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: >-
    Suivi des conventions de partenariat de la Région Souss-Massa.
    Le statut d'alerte n'est jamais stocké : il est recalculé à chaque requête
    par rapport à la date du jour.
servers:
  - url: /api
    description: Base API path
security:
  - apiSession: []
tags:
  - name: health
    description: Health operations
  - name: conventions
    description: Gestion des conventions et de leurs comités de suivi
  - name: auth
    description: Authentification
  - name: admin
    description: Administration des comptes et audit
  - name: reference-data
    description: Référentiel organisationnel et maîtrises d'ouvrage
  - name: storage
    description: Téléversement privé des documents de convention
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Obtenir une URL temporaire pour téléverser un document
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlInput" }
      responses:
        "200":
          description: URL temporaire générée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrl" }
        "400":
          description: Métadonnées de fichier invalides
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }
        "401": { description: Authentification requise }
        "403": { description: Rôle non autorisé à téléverser }
        "500":
          description: Impossible de préparer le téléversement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }
  /storage/uploads/complete:
    post:
      operationId: completeUpload
      tags: [storage]
      summary: Vérifier et finaliser un document téléversé
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteUploadInput" }
      responses:
        "200":
          description: Document validé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredDocument" }
        "400":
          description: Document invalide, trop volumineux ou de format non autorisé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }
        "401": { description: Authentification requise }
        "403": { description: Rôle non autorisé à téléverser }
        "404":
          description: Fichier temporaire introuvable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }
  /conventions/{id}/documents/{field}:
    get:
      operationId: downloadConventionDocument
      tags: [conventions]
      summary: Télécharger un document privé d'une convention
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: field
          in: path
          required: true
          schema:
            type: string
            enum: [documentConvention, pv]
      responses:
        "200":
          description: Fichier PDF ou Word
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Authentification requise }
        "403": { description: Accès à la convention non autorisé }
        "404":
          description: Convention ou fichier introuvable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Utilisateur authentifié
      responses:
        "200":
          description: Session courante
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "401": { description: Authentification requise }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Ouvrir une session avec identifiant et mot de passe
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Session ouverte, cookie HttpOnly posé
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "401": { description: Identifiants invalides }
        "429": { description: Trop de tentatives }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Révoquer la session courante
      responses:
        "204": { description: Session révoquée }
        "401": { description: Authentification requise }

  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: Lister les comptes (administrateur uniquement)
      responses:
        "200":
          description: Comptes sans informations de mot de passe
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
    post:
      operationId: createUser
      tags: [admin]
      summary: Créer un compte (administrateur uniquement)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { description: Données invalides }
  /reference-data:
    get:
      operationId: getReferenceData
      tags: [reference-data]
      summary: Référentiel courant de l'organigramme et des maîtrises d'ouvrage
      responses:
        "200":
          description: Référentiel hiérarchique courant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceData" }
        "401": { description: Authentification requise }
  /admin/reference-data/{kind}:
    post:
      operationId: createReferenceDataEntry
      tags: [admin]
      summary: Ajouter une entrée au référentiel (administrateur uniquement)
      parameters:
        - name: kind
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ReferenceDataKind" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceDataInput" }
      responses:
        "200":
          description: Référentiel complet mis à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceData" }
        "400": { description: Données ou parent invalides }
        "403": { description: Administrateur uniquement }
        "409": { description: Une entrée de même nom existe déjà }
  /admin/reference-data/{kind}/{id}:
    patch:
      operationId: renameReferenceDataEntry
      tags: [admin]
      summary: Renommer une entrée sans la supprimer (administrateur uniquement)
      parameters:
        - name: kind
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ReferenceDataKind" }
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceDataRename" }
      responses:
        "200":
          description: Référentiel complet mis à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceData" }
        "400": { description: Nom invalide ou conflit d'unicité }
        "403": { description: Administrateur uniquement }
        "404": { description: Entrée introuvable }
        "409": { description: Une entrée de même nom existe déjà }
  /admin/users/{id}:
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Modifier un compte (administrateur uniquement)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Compte modifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { description: Données invalides }
        "404": { description: Compte introuvable }
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Supprimer définitivement un compte non administrateur
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Compte supprimé et sessions révoquées }
        "400": { description: Identifiant invalide }
        "403": { description: Les comptes administrateurs ne peuvent pas être supprimés }
        "404": { description: Compte introuvable }
  /admin/users/{id}/password:
    post:
      operationId: resetUserPassword
      tags: [admin]
      summary: Réinitialiser le mot de passe et révoquer les sessions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordInput" }
      responses:
        "204": { description: Mot de passe réinitialisé }
        "404": { description: Compte introuvable }
  /admin/audit:
    get:
      operationId: listAudit
      tags: [admin]
      summary: Consulter l'historique des modifications (administrateur uniquement)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: conventionId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Historique paginé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }

  /conventions:
    get:
      operationId: listConventions
      tags: [conventions]
      summary: Liste paginée et filtrée des conventions
      parameters:
        - name: q
          in: query
          description: Recherche texte (nom de convention, responsable, porteur de projet, maîtrise d'ouvrage). Supporte l'arabe.
          schema: { type: string }
        - name: alerte
          in: query
          description: Filtre sur le niveau d'alerte recalculé
          schema: { $ref: "#/components/schemas/NiveauAlerte" }
        - name: statutConvention
          in: query
          schema: { type: string }
        - name: rattachement
          in: query
          schema: { type: string }
        - name: responsableProjet
          in: query
          schema: { type: string }
        - name: natureFonds
          in: query
          schema: { type: string }
        - name: decision
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
        - name: tri
          in: query
          description: Champ de tri
          schema:
            type: string
            enum:
              - urgence
              - nomConvention
              - prochaineEcheance
              - dernierComite
              - responsableProjet
              - statutConvention
            default: urgence
        - name: ordre
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: Page de résultats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConventionPage"
    post:
      operationId: createConvention
      tags: [conventions]
      summary: Créer une convention
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConventionInput"
      responses:
        "201":
          description: Convention créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convention"
        "400":
          description: Données invalides
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }

  /conventions/resume:
    get:
      operationId: getResumeAlertes
      tags: [conventions]
      summary: Compteurs par niveau d'alerte et indicateurs de pilotage
      responses:
        "200":
          description: Résumé recalculé à l'instant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeAlertes"

  /conventions/alertes:
    get:
      operationId: listAlertes
      tags: [conventions]
      summary: Conventions en retard ou à échéance proche, triées par urgence
      parameters:
        - name: horizonJours
          in: query
          description: Inclure les échéances jusqu'à N jours (les retards sont toujours inclus)
          schema: { type: integer, minimum: 0, maximum: 365, default: 60 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Liste triée par urgence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Convention"

  /conventions/agenda:
    get:
      operationId: getAgenda
      tags: [conventions]
      summary: Échéances à venir regroupées par mois
      parameters:
        - name: mois
          in: query
          description: Nombre de mois à couvrir
          schema: { type: integer, minimum: 1, maximum: 24, default: 6 }
      responses:
        "200":
          description: Agenda groupé par mois
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MoisAgenda"

  /conventions/options-filtres:
    get:
      operationId: getOptionsFiltres
      tags: [conventions]
      summary: Valeurs distinctes disponibles pour alimenter les filtres
      responses:
        "200":
          description: Options de filtrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionsFiltres"

  /conventions/{id}:
    get:
      operationId: getConvention
      tags: [conventions]
      summary: Détail d'une convention
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Convention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convention"
        "404":
          description: Introuvable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }
    patch:
      operationId: updateConvention
      tags: [conventions]
      summary: Mettre à jour une convention
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConventionUpdate"
      responses:
        "200":
          description: Convention mise à jour (statut d'alerte recalculé)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Convention"
        "400":
          description: Données invalides
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }
        "404":
          description: Introuvable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }
        "409":
          description: Version obsolète
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }
    delete:
      operationId: deleteConvention
      tags: [conventions]
      summary: Supprimer une convention
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: version
          in: query
          required: true
          description: Version attendue pour empêcher les suppressions obsolètes
          schema: { type: integer, minimum: 1 }
      responses:
        "204":
          description: Supprimée
        "404":
          description: Introuvable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }
        "409":
          description: Version obsolète
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erreur" }

components:
  securitySchemes:
    apiSession:
      type: apiKey
      in: cookie
      name: region_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Erreur:
      type: object
      required: [error]
      properties:
        error: { type: string }

    UploadUrlInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType:
          type: string
          enum:
            - application/pdf
            - application/msword
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    UploadUrl:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    CompleteUploadInput:
      type: object
      required: [objectPath, name]
      properties:
        objectPath: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 255 }
    StoredDocument:
      type: object
      required: [objectPath, name, contentType, size]
      properties:
        objectPath: { type: string }
        name: { type: string }
        contentType: { type: string }
        size: { type: integer, minimum: 1, maximum: 10485760 }

    NiveauAlerte:
      type: string
      description: |
        Niveau d'alerte recalculé par rapport à la date du jour.
        EN_RETARD : échéance dépassée.
        A_DECLENCHER : échéance dans 0 à 30 jours.
        A_PREPARER : échéance dans 31 à 60 jours.
        A_JOUR : échéance au-delà de 60 jours.
        A_SURVEILLER : pas d'échéance, fréquence conditionnelle.
        A_QUALIFIER : pas d'échéance, donnée manquante.
      enum:
        - EN_RETARD
        - A_DECLENCHER
        - A_PREPARER
        - A_JOUR
        - A_SURVEILLER
        - A_QUALIFIER

    Alerte:
      type: object
      required: [niveau, libelle, action, couleur]
      properties:
        niveau: { $ref: "#/components/schemas/NiveauAlerte" }
        libelle:
          type: string
          description: Libellé français affichable, ex. "En retard"
        action:
          type: string
          description: Action type associée au niveau
        couleur:
          type: string
          description: Clé de couleur de la légende
          enum: [rouge, orange, jaune, vert, gris]
        joursRestants:
          type: ["integer", "null"]
          description: Jours avant l'échéance (négatif si dépassée), null si pas d'échéance

    Convention:
      type: object
      required: [id, nomConvention, alerte, version, maitriseOuvrage, maitriseOuvrageDeleguee]
      properties:
        id: { type: integer }
        version: { type: integer }
        nomConvention: { type: string }
        objetConventionFr: { type: ["string", "null"] }
        rattachement: { type: ["string", "null"] }
        responsableProjet: { type: ["string", "null"] }
        typeSession:
          type: ["string", "null"]
          enum: [Ordinaire, Extraordinaire, null]
        session:
          type: ["string", "null"]
          format: date
        dateVisa:
          type: ["string", "null"]
          format: date
        presidenceComite: { type: ["string", "null"] }
        membresComite: { type: ["string", "null"] }
        frequenceReunions: { type: ["string", "null"] }
        enveloppeBudgetaire:
          type: ["number", "null"]
          description: Montant en MAD
        contributionRegion:
          type: ["number", "null"]
          description: Montant en MAD
        porteurProjet: { type: ["string", "null"] }
        maitriseOuvrage: { type: array, items: { type: string } }
        maitriseOuvrageDeleguee: { type: array, items: { type: string } }
        prochainComite:
          type: ["string", "null"]
          format: date
        dernierComite:
          type: ["string", "null"]
          format: date
        dernierComiteNote:
          type: ["string", "null"]
          description: Mention non convertible en date reprise du fichier source
        pv: { type: ["string", "null"] }
        decision: { type: ["string", "null"] }
        competence: { type: ["string", "null"] }
        nature: { type: ["string", "null"] }
        documentConvention: { type: ["string", "null"] }
        ficheTechnique: { type: ["string", "null"] }
        statutConvention: { type: ["string", "null"] }
        prochaineEcheance:
          type: ["string", "null"]
          format: date
        prochaineEcheanceNote:
          type: ["string", "null"]
          description: Mention non convertible en date reprise du fichier source
        natureFonds: { type: ["string", "null"] }
        commentaires: { type: ["string", "null"] }
        sourceImport: { type: ["string", "null"] }
        alerte: { $ref: "#/components/schemas/Alerte" }
        creeLe: { type: ["string", "null"], format: date-time }
        modifieLe: { type: ["string", "null"], format: date-time }

    ConventionInput:
      type: object
      required: [nomConvention]
      properties:
        nomConvention: { type: string, minLength: 1 }
        objetConventionFr: { type: ["string", "null"] }
        rattachement: { type: ["string", "null"] }
        responsableProjet: { type: ["string", "null"] }
        typeSession:
          type: ["string", "null"]
          enum: [Ordinaire, Extraordinaire, null]
        session:
          type: ["string", "null"]
          format: date
        dateVisa: { type: ["string", "null"], format: date }
        presidenceComite: { type: ["string", "null"] }
        membresComite: { type: ["string", "null"] }
        frequenceReunions: { type: ["string", "null"] }
        enveloppeBudgetaire: { type: ["number", "null"] }
        contributionRegion: { type: ["number", "null"] }
        porteurProjet: { type: ["string", "null"] }
        maitriseOuvrage:
          type: ["array", "null"]
          items: { type: string }
        maitriseOuvrageDeleguee:
          type: ["array", "null"]
          items: { type: string }
        prochainComite: { type: ["string", "null"], format: date }
        dernierComite: { type: ["string", "null"], format: date }
        dernierComiteNote: { type: ["string", "null"] }
        pv: { type: ["string", "null"] }
        documentConvention: { type: ["string", "null"] }
        ficheTechnique: { type: ["string", "null"] }
        statutConvention: { type: ["string", "null"] }
        prochaineEcheance: { type: ["string", "null"], format: date }
        prochaineEcheanceNote: { type: ["string", "null"] }
        natureFonds: { type: ["string", "null"] }
        competence: { type: ["string", "null"] }
        nature: { type: ["string", "null"] }
        commentaires: { type: ["string", "null"] }

    ConventionUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        nomConvention: { type: string, minLength: 1 }
        objetConventionFr: { type: ["string", "null"] }
        rattachement: { type: ["string", "null"] }
        responsableProjet: { type: ["string", "null"] }
        typeSession:
          type: ["string", "null"]
          enum: [Ordinaire, Extraordinaire, null]
        session:
          type: ["string", "null"]
          format: date
        dateVisa: { type: ["string", "null"], format: date }
        presidenceComite: { type: ["string", "null"] }
        membresComite: { type: ["string", "null"] }
        frequenceReunions: { type: ["string", "null"] }
        enveloppeBudgetaire: { type: ["number", "null"] }
        contributionRegion: { type: ["number", "null"] }
        porteurProjet: { type: ["string", "null"] }
        maitriseOuvrage:
          type: ["array", "null"]
          items: { type: string }
        maitriseOuvrageDeleguee:
          type: ["array", "null"]
          items: { type: string }
        prochainComite: { type: ["string", "null"], format: date }
        dernierComite: { type: ["string", "null"], format: date }
        dernierComiteNote: { type: ["string", "null"] }
        pv: { type: ["string", "null"] }
        decision: { type: ["string", "null"] }
        competence: { type: ["string", "null"] }
        nature: { type: ["string", "null"] }
        documentConvention: { type: ["string", "null"] }
        ficheTechnique: { type: ["string", "null"] }
        statutConvention: { type: ["string", "null"] }
        prochaineEcheance: { type: ["string", "null"], format: date }
        prochaineEcheanceNote: { type: ["string", "null"] }
        natureFonds: { type: ["string", "null"] }
        commentaires: { type: ["string", "null"] }

    ConventionPage:
      type: object
      required: [items, total, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Convention" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }

    CompteurAlerte:
      type: object
      required: [niveau, libelle, couleur, nombre]
      properties:
        niveau: { $ref: "#/components/schemas/NiveauAlerte" }
        libelle: { type: string }
        couleur:
          type: string
          enum: [rouge, orange, jaune, vert, gris]
        nombre: { type: integer }

    ResumeAlertes:
      type: object
      required:
        - total
        - compteurs
        - aTraiter
        - dateCalcul
        - sansEcheance
      properties:
        total:
          type: integer
          description: Nombre total de conventions
        compteurs:
          type: array
          description: Un compteur par niveau d'alerte, dans l'ordre d'urgence
          items: { $ref: "#/components/schemas/CompteurAlerte" }
        aTraiter:
          type: integer
          description: Conventions en retard ou à échéance dans 60 jours
        sansEcheance:
          type: integer
          description: Conventions sans prochaine échéance renseignée
        prochaineEcheanceDate:
          type: ["string", "null"]
          format: date
          description: Date de la prochaine échéance à venir, tous dossiers confondus
        dateCalcul:
          type: string
          format: date
          description: Date du jour utilisée pour le calcul

    MoisAgenda:
      type: object
      required: [mois, libelle, nombre, conventions]
      properties:
        mois:
          type: string
          description: Mois au format AAAA-MM
        libelle:
          type: string
          description: Libellé français du mois, ex. "octobre 2026"
        nombre: { type: integer }
        conventions:
          type: array
          items: { $ref: "#/components/schemas/Convention" }

    OptionsFiltres:
      type: object
      required:
        - rattachements
        - responsables
        - statuts
        - naturesFonds
        - decisions
      properties:
        rattachements:
          type: array
          items: { type: string }
        responsables:
          type: array
          items: { type: string }
        statuts:
          type: array
          items: { type: string }
        naturesFonds:
          type: array
          items: { type: string }
        decisions:
          type: array
          items: { type: string }

    ReferenceDataKind:
      type: string
      enum: [directions, divisions, services, maitrises-ouvrage]
    ReferenceService:
      type: object
      required: [id, nom]
      properties:
        id: { type: integer }
        nom: { type: string }
    ReferenceDivision:
      type: object
      required: [id, nom, services]
      properties:
        id: { type: integer }
        nom: { type: string }
        services:
          type: array
          items: { $ref: "#/components/schemas/ReferenceService" }
    ReferenceDirection:
      type: object
      required: [id, direction, divisions]
      properties:
        id: { type: integer }
        direction: { type: string }
        divisions:
          type: array
          items: { $ref: "#/components/schemas/ReferenceDivision" }
    ReferenceData:
      type: object
      required: [organisation, maitrisesOuvrage]
      properties:
        organisation:
          type: array
          items: { $ref: "#/components/schemas/ReferenceDirection" }
        maitrisesOuvrage:
          type: array
          items: { $ref: "#/components/schemas/ReferenceService" }
    ReferenceDataInput:
      type: object
      required: [nom]
      properties:
        nom: { type: string, minLength: 1, maxLength: 255 }
        parentId:
          type: integer
          minimum: 1
          description: ID de direction pour une division ou de division pour un service; interdit pour les directions et maîtrises d'ouvrage.
    ReferenceDataRename:
      type: object
      required: [nom]
      properties:
        nom: { type: string, minLength: 1, maxLength: 255 }

    Role:
      type: string
      enum: [admin, directeur, directeur_general_services, chef_division, chef_service]
    AuthUser:
      type: object
      required: [id, username, role, direction, division, service, active]
      properties:
        id: { type: integer }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        direction: { type: ["string", "null"] }
        division: { type: ["string", "null"] }
        service: { type: ["string", "null"] }
        active: { type: boolean }
    AdminUser:
      allOf:
        - $ref: "#/components/schemas/AuthUser"
        - type: object
          required: [createdAt]
          properties:
            createdAt: { type: string, format: date-time }
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 1, maxLength: 1024 }
    UserInput:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 8, maxLength: 1024 }
        role: { $ref: "#/components/schemas/Role" }
        direction: { type: ["string", "null"] }
        division: { type: ["string", "null"] }
        service: { type: ["string", "null"] }
        active: { type: boolean, default: true }
    UserUpdate:
      type: object
      properties:
        username: { type: string, minLength: 1, maxLength: 100 }
        role: { $ref: "#/components/schemas/Role" }
        direction: { type: ["string", "null"] }
        division: { type: ["string", "null"] }
        service: { type: ["string", "null"] }
        active: { type: boolean }
    PasswordInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8, maxLength: 1024 }
    AuditEvent:
      type: object
      required: [id, conventionId, action, actorUsername, before, after, createdAt]
      properties:
        id: { type: integer }
        conventionId: { type: integer }
        action: { type: string, enum: [create, update, delete] }
        actorUsername: { type: string }
        before: { type: ["object", "null"], additionalProperties: true }
        after: { type: ["object", "null"], additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        total: { type: integer }
